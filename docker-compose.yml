services:
  backend:
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    container_name: bonustest-backend
    ports:
      - '5106:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BonusTest:
        'Server=host.containers.internal,1433;Database=BonusTest;User
        Id=sa;Password=Password2026;TrustServerCertificate=True;'
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bonustest-frontend
    ports:
      - '4200:80'
    depends_on:
      - backend
    restart: unless-stopped
